# Infraestructura como código para Render (https://render.com/docs/blueprint-spec).
# Crea el servicio con: New + > Blueprint > seleccionar el repo.
services:
  - type: web
    name: invitador
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # No hay carpeta `prisma/migrations/`, así que el schema se sincroniza con
    # `prisma db push` (contra la connection string DIRECTA de Neon) en lugar de
    # `migrate deploy`. `--accept-data-loss` es necesario para eliminar la tabla
    # `MagicLinkToken`, que ya no se usa.
    # El seed de fondos demo es idempotente (upsert por id), así que puede correr
    # en cada deploy sin duplicar filas.
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed:backgrounds && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
