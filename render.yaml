# Infraestructura como código para Render (https://render.com/docs/blueprint-spec).
# Crea el servicio con: New + > Blueprint > seleccionar el repo.
services:
  - type: web
    name: invitador
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # El esquema vive versionado en `prisma/migrations/` y se aplica con
    # `prisma migrate deploy` (contra la connection string DIRECTA de Neon), que
    # es idempotente y no destructivo: ya no hay `prisma db push
    # --accept-data-loss` en cada deploy. `0_init` es el baseline del esquema que
    # ya existía en producción, así que allí hay que marcarlo como aplicado una
    # sola vez (`npx prisma migrate resolve --applied 0_init`).
    # `npm ci` (no `npm install`) instala exactamente lo que fija el lockfile y
    # `--include=dev` garantiza las herramientas del build (prisma, tsx,
    # typescript, vitest) aunque el entorno llegue con NODE_ENV=production.
    # Antes de compilar se pasa la misma puerta de calidad que en local
    # (typecheck, lint y tests): si algo falla, el deploy no se publica.
    # El seed de fondos demo es idempotente (upsert por id), así que puede correr
    # en cada deploy sin duplicar filas.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run db:seed:backgrounds && npm run typecheck && npm run lint && npm test && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
